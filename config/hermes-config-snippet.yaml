# Hermes Config Snippet - Add to ~/.hermes/config.yaml or profile config

# This tells Hermes to route all vision requests (vision_analyze,
# browser_vision) to your local SmolVLM server instead of the cloud.

auxiliary:
  vision:
    provider: openai           # Use OpenAI-compatible client
    model: SmolVLM-Instruct-Q4_K_M.gguf
    base_url: "http://127.0.0.1:11788/v1"
    api_key: "<auto-generated, run: blip.sh show-key>"      # Local server doesn't need auth
    timeout: 120
    extra_body: {}
    download_timeout: 30

# ── Cron Watchdog ──────────────────────────────────────────────────────────
# Run after adding config to set up the auto-lifecycle:
#
#   hermes cron create --name smolvlm-watchdog \
#     --schedule "every 10m" \
#     --script blip-watchdog.sh \
#     --no-agent
#
# This keeps the server alive and idle-shuts it after 30 min.
